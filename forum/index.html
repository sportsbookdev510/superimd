<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMD Forum</title>
    <meta
      name="description"
      content="SIMD Forum — Identity.md boards for holders and builders."
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=40" />
    <link rel="stylesheet" href="/forum/forum.css?v=5" />
  </head>
  <body class="forum-app">
    <header class="rf-top">
      <a class="rf-brand" href="/" title="Back to SIMD">
        <img class="logo" src="/logo.jpg" width="32" height="32" alt="SIMD" />
        <span class="wordmark">SIMD</span>
        <span class="rf-brand-sub">Forum</span>
      </a>
      <label class="rf-search">
        <span class="sr-only">Search forum</span>
        <input
          id="rf-search"
          type="search"
          autocomplete="off"
          placeholder="Search boards and posts"
        />
      </label>
      <div class="rf-top-actions" id="rf-auth"></div>
    </header>

    <div class="rf-shell">
      <aside class="rf-left" id="rf-left"></aside>
      <main class="rf-main" id="rf-main">
        <p class="hint" style="padding: 18px">Loading forum…</p>
      </main>
      <aside class="rf-right" id="rf-right"></aside>
    </div>

    <p class="rf-toast" id="rf-toast" hidden></p>
    <script src="/forum/forum.js?v=9" type="module"></script>
  </body>
</html>
